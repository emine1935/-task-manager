# OPSİYONEL: CI/CD ile otomatik deploy istiyorsanız kullanın.
# İstemiyorsanız bu dosyayı silip sadece manuel "ssh + ./deploy.sh" ile de
# ilerleyebilirsiniz — deploy.sh script'i her iki durumda da aynıdır.
#
# Gerekli GitHub Secrets (Repo > Settings > Secrets and variables > Actions):
#   SERVER_HOST       -> Sunucunun IP adresi
#   SERVER_USER       -> SSH kullanıcı adı
#   SERVER_SSH_KEY    -> SSH private key (id_ed25519 içeriği)
#   SERVER_APP_DIR    -> Sunucuda projenin bulunduğu klasör (örn. /opt/task-manager)

name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile sunucuya bağlan ve deploy et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_APP_DIR }}
            ./deploy.sh main
