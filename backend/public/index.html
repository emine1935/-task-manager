<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defter &#8212; G&#246;rev Y&#246;neticisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1EC;
    --paper-card: #FBFBF9;
    --ink: #22261F;
    --ink-soft: #5B6154;
    --line: #C9CFC0;
    --margin-red: #B5453C;
    --accent: #2E4034;
    --accent-soft: #4C6B5A;
    --done: #9AA292;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 20px;
  }

  .notebook {
    width: 100%;
    max-width: 640px;
    background: var(--paper-card);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(34,38,31,0.06), 0 12px 32px rgba(34,38,31,0.08);
    position: relative;
    padding: 48px 40px 40px 76px;
    border: 1px solid var(--line);
  }

  .notebook::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 52px;
    width: 1px;
    background: var(--margin-red);
    opacity: 0.55;
  }
  .holes {
    position: absolute;
    left: 22px;
    top: 48px;
    bottom: 48px;
    width: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .holes span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
  }

  header {
    margin-bottom: 28px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin: 0 0 6px 0;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .sub .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-soft);
    margin-right: 6px;
    vertical-align: middle;
  }
  .sub .dot.off { background: var(--margin-red); }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus {
    border-color: var(--accent-soft);
  }
  input[type="text"]::placeholder {
    color: #9AA292;
  }
  button.add {
    background: var(--accent);
    color: var(--paper-card);
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.add:hover { background: var(--accent-soft); }
  button.add:disabled { opacity: 0.5; cursor: default; }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--line);
  }
  li.task:last-child { border-bottom: none; }

  .check {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border: 1.5px solid var(--accent-soft);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-card);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check.checked::after {
    content: "";
    width: 5px;
    height: 9px;
    border-right: 2px solid var(--paper-card);
    border-bottom: 2px solid var(--paper-card);
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .task-body { flex: 1; min-width: 0; }
  .title {
    font-size: 15px;
    color: var(--ink);
    word-break: break-word;
    cursor: pointer;
  }
  .title.done {
    color: var(--done);
    text-decoration: line-through;
    text-decoration-color: var(--done);
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 3px;
    opacity: 0.75;
  }

  .del {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--margin-red);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
    padding: 2px 4px;
  }
  li.task:hover .del { opacity: 0.7; }
  .del:hover { opacity: 1 !important; }

  .empty {
    text-align: center;
    padding: 32px 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-style: italic;
  }

  footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .refresh {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .refresh:hover { border-color: var(--accent-soft); color: var(--accent-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 480px) {
    .notebook { padding: 40px 24px 32px 60px; }
    .notebook::before { left: 40px; }
    .holes { left: 14px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="notebook">
  <div class="holes">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>
    <p class="eyebrow">G&#246;rev Defteri</p>
    <h1>Bug&#252;n ne yap&#305;lacak?</h1>
    <p class="sub" id="status"><span class="dot"></span>Ba&#287;lan&#305;yor&#8230;</p>
  </header>

  <form id="task-form">
    <input type="text" id="task-input" placeholder="Yeni bir g&#246;rev yaz&#8230;" autocomplete="off" maxlength="255" />
    <button type="submit" class="add" id="add-btn">Ekle</button>
  </form>

  <ul class="tasks" id="task-list"></ul>
  <div class="empty" id="empty-msg" style="display:none;">Hen&#252;z g&#246;rev yok. &#304;lk g&#246;revini yukar&#305;dan ekle.</div>

  <footer>
    <span class="count" id="count-label">&#8212; </span>
    <button class="refresh" id="refresh-btn">Yenile</button>
  </footer>
</div>

<script>
  const API = '';
  const form = document.getElementById('task-form');
  const input = document.getElementById('task-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');
  const emptyMsg = document.getElementById('empty-msg');
  const statusEl = document.getElementById('status');
  const countLabel = document.getElementById('count-label');
  const refreshBtn = document.getElementById('refresh-btn');

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' }) + ' \u00b7 ' +
           d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function render(tasks) {
    list.innerHTML = '';
    if (tasks.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task';

        const check = document.createElement('div');
        check.className = 'check' + (task.is_done ? ' checked' : '');
        check.onclick = () => toggleTask(task.id);

        const body = document.createElement('div');
        body.className = 'task-body';

        const title = document.createElement('div');
        title.className = 'title' + (task.is_done ? ' done' : '');
        title.textContent = task.title;
        title.onclick = () => toggleTask(task.id);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = formatDate(task.created_at);

        body.appendChild(title);
        body.appendChild(meta);

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'sil';
        del.onclick = () => deleteTask(task.id);

        li.appendChild(check);
        li.appendChild(body);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    const openCount = tasks.filter(t => !t.is_done).length;
    countLabel.textContent = `${tasks.length} g\u00f6rev \u00b7 ${openCount} a\u00e7\u0131k`;
  }

  async function loadTasks() {
    try {
      const res = await fetch(`${API}/tasks`);
      if (!res.ok) throw new Error('\u0130stek ba\u015far\u0131s\u0131z');
      const tasks = await res.json();
      render(tasks);
      setStatus(true);
    } catch (err) {
      setStatus(false);
    }
  }

  function setStatus(ok) {
    statusEl.innerHTML = ok
      ? '<span class="dot"></span>Sunucuya ba\u011fl\u0131'
      : '<span class="dot off"></span>Ba\u011flant\u0131 yok';
  }

  async function addTask(title) {
    addBtn.disabled = true;
    try {
      const res = await fetch(`${API}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      if (!res.ok) throw new Error('Eklenemedi');
      input.value = '';
      await loadTasks();
    } catch (err) {
      alert('G\u00f6rev eklenemedi: ' + err.message);
    } finally {
      addBtn.disabled = false;
      input.focus();
    }
  }

  async function toggleTask(id) {
    try {
      const res = await fetch(`${API}/tasks/${id}/toggle`, { method: 'PATCH' });
      if (!res.ok) throw new Error('G\u00fcncellenemedi');
      await loadTasks();
    } catch (err) {
      alert('G\u00f6rev g\u00fcncellenemedi: ' + err.message);
    }
  }

  async function deleteTask(id) {
    try {
      const res = await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 204) throw new Error('Silinemedi');
      await loadTasks();
    } catch (err) {
      alert('G\u00f6rev silinemedi: ' + err.message);
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (title) addTask(title);
  });

  refreshBtn.addEventListener('click', loadTasks);

  loadTasks();
</script>

</body>
</html>
